{% extends "base.html" %}
{% block title %}
    {{ request.app.openapi_config.title }} - Events
{% endblock title %}
{% block content %}
    <script defer
            src="https://unpkg.com/@highlightjs/cdn-assets@11.9.0/highlight.min.js"
            integrity="sha512-D9gUyxqja7hBtkWpPWGt9wfbfaMGVt9gnyCvYa+jojwwPHLCzUm5i8rpk7vD7wNee9bA35eYIjobYPaQuKS1MQ=="
            crossorigin="anonymous"></script>
    <link rel="stylesheet"
          href="/static/event.css?{{ request.app.openapi_config.version }}">
    <div class="narrow-container">
        <h1>Events</h1>
        <p class="dense-text">Events are records of things that have happened in the system.</p>
        <div class="load-with-dropdown">
            <button hx-get="/events/search"
                    hx-trigger="load, click"
                    hx-target="#events-container"
                    hx-swap="transition:true"
                    hx-include="[name='search_type'],[name='sort'],[name='pageSize']"
                    class="pagination-button">Reload</button>
            <label class="visually-hidden" for="event-search-type">Event type</label>
            <select class="dropdown" id="event-search-type" name="search_type">
                {% for value, label in event_types %}<option value="{{ value }}">{{ label }}</option>{% endfor %}
            </select>
            <label class="visually-hidden" for="event-sort">Sort order</label>
            <select class="dropdown" id="event-sort" name="sort">
                <option value="desc">Newest first</option>
                <option value="asc">Oldest first</option>
            </select>
            <label class="visually-hidden" for="event-page-size">Page size</label>
            <select class="dropdown" id="event-page-size" name="pageSize">
                <option value="10">10 per page</option>
                <option value="20">20 per page</option>
                <option value="50">50 per page</option>
                <option value="100">100 per page</option>
            </select>
        </div>
        <div class="events-container" id="events-container"></div>
    </div>
{% endblock content %}
