<h3 class="h3-table">Current Static Database Statistics</h3>
<table class="table-search table-sortable table-search--static-head"
       aria-label="Static Database Statistics">
    <thead class="hoverable">
        <tr>
            <th class="dense-text">Name</th>
            <th class="dense-text">Total Entries</th>
            <th class="dense-text" data-type="number">Percentage</th>
        </tr>
    </thead>
    <tbody>
        {% for key, value, percentage in stats_with_percentages %}
            <tr>
                <td class="dense-text no-pointer">{{ key }}</td>
                <td class="dense-text no-pointer">{{ value }}</td>
                <td class="dense-text no-pointer">{{ percentage }}%</td>
            </tr>
        {% endfor %}
    </tbody>
</table>
<script>
document.querySelectorAll(".table-sortable th").forEach((headerCell) => {
  headerCell.addEventListener("click", () => {
    const tableElement = headerCell.parentElement.parentElement.parentElement;
    const headerIndex = Array.prototype.indexOf.call(
      headerCell.parentElement.children,
      headerCell
    );
    const currentIsAscending = headerCell.classList.contains("th-sort-asc");

    sortTableByColumn(tableElement, headerIndex, !currentIsAscending);
  });
});
</script>
