{% extends "base.html" %}
{% block title %}
    SimplyTransport - Routes
{% endblock title %}
{% block content %}
    <div class="narrow-container">
        <h1 class="dots-flashing-flex">
            Route Search
            {% include "widgets/dots_flashing.html" %}
            <div class="dot-flashing"></div>
        </h1>
        <p class="dense-text">
            Matches <span class="code-highlight">names</span> or <span class="code-highlight">codes</span> that start with your search term
        </p>
        <div class="inner-container search-results-stack">
            <div class="input-with-loader">
                <label class="visually-hidden" for="route-search">Search routes</label>
                <input class="search-box"
                       id="route-search"
                       hx-get="/search/routes?pageSize=20"
                       hx-trigger="keyup[target.value.length> 0] changed delay:200ms, search"
                       hx-target="#route-search-results"
                       hx-swap="innerhtml transition:true"
                       type="search"
                       name="search"
                       placeholder="Search routes...">
                <span class="htmx-indicator">
                    <img class="loader-svg"
                         src="/static/loader.svg"
                         width="30px"
                         height="30px"
                         alt="Loading spinner">
                </span>
            </div>
            <div id="route-search-results">
                <table class="table-search" aria-label="Search Results">
                    <thead>
                        <tr>
                            <th class="dense-text">Code</th>
                            <th class="dense-text">Long Name</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Waiting for your search 😊</td>
                            <td></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
{% endblock content %}
