name: Docker Tests on Pull Request

on:
  pull_request:
    branches: ["*"]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-test:
    name: Test Docker Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create env file
        run: |
          cat << EOF > .env
          ENVIRONMENT=PR-TEST-CI

          # Database
          DB_URL=postgresql+asyncpg://example:example@postgres:5432/example
          DB_ECHO=false
          TIMESCALE_URL=postgresql+asyncpg://example:example@timescale:5432/example

          # Postgres Docker
          POSTGRES_DB=example
          POSTGRES_USER=example
          POSTGRES_PASSWORD=example

          # Timescale Docker
          TIMESCALE_DB=example
          TIMESCALE_USER=example
          TIMESCALE_PASSWORD=example

          # Redis
          REDIS_PASSWORD=example
          REDIS_PORT=6379
          EOF

      - name: Build and start services
        run: docker compose -f docker-compose.prod.yaml up -d --build --wait

      - name: Check service status
        run: |
          echo "Checking service status..."
          docker ps
          docker logs simplytransport

          echo "Testing PostgreSQL connection..."
          docker exec postgres pg_isready -U example

          echo "Testing Redis connection... expect pong response"
          docker exec redis redis-cli -a example ping

          echo "Testing TimescaleDB connection..."
          docker exec timescale pg_isready -U example

          echo "Testing application health..."
          curl -f http://localhost:8000/healthcheck

      - name: Show logs on failure
        if: failure()
        run: |
          echo "Docker compose logs:"
          docker compose -f docker-compose.prod.yaml logs

          echo "Container status:"
          docker ps -a

          echo "Network status:"
          docker network ls
          docker network inspect simplytransport-network

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.prod.yaml down -v
