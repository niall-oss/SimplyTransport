version: "3.8"

services:
  postgres:
    image: postgres:alpine
    container_name: st-test-postgres
    environment:
      POSTGRES_USER: st_test
      POSTGRES_PASSWORD: st_test
      POSTGRES_DB: st_database
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U st_test -d st_database"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  timescale:
    image: timescale/timescaledb:latest-pg16
    container_name: st-test-timescale
    environment:
      POSTGRES_USER: st_test
      POSTGRES_PASSWORD: st_test
      POSTGRES_DB: st_ts_database
    ports:
      - "15433:5432"
    healthcheck:
      # Timescale restarts Postgres after first init; pg_isready alone is too early.
      test:
        [
          "CMD-SHELL",
          "pg_isready -U st_test -d st_ts_database && psql -U st_test -d st_ts_database -c 'SELECT 1'",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  redis:
    image: redis:alpine
    container_name: st-test-redis
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 20
